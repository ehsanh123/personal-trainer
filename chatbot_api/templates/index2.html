<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Chatbot</title>
</head>

<body>
  
    <h1>Chatbot</h1>
    <div id="chat-box"></div>

    <form id="chat-form">
        <input type="text" id="user-input" placeholder="Say something..." required />
        <button type="submit">Send</button>
    </form>
    <text id="response">{{res1}}</text>
      
    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("user-input");
    
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
    
          const message = input.value;
    
          const res = await fetch("/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ message }),
          });
    
        //   const data = await res.json();
        //   console.log("Bot replied:", data.response);
        const data = await res.text(); // if you're returning HTML
        document.documentElement.innerHTML = data;
          // ⬇️ Reload the page after the bot responds
        //   window.location.reload();
        });
    </script>

</body>
</html>
